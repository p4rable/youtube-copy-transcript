<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'">
<title>Why suspension bridges sag on purpose - YouTube</title>
<style>
  /* A stripped-down copy of YouTube's watch page structure (as of 2026), enough to drive the extension. */
  body { margin: 0; font: 14px Roboto, Arial, sans-serif; background: #fff; color: #0f0f0f; }
  html[dark] body { background: #0f0f0f; color: #f1f1f1; }
  ytd-app, ytd-watch-flexy, ytd-watch-metadata, ytd-menu-renderer, ytd-engagement-panel-section-list-renderer,
  ytd-text-inline-expander, ytd-video-description-transcript-section-renderer { display: block; }
  ytd-watch-flexy { display: flex; gap: 24px; padding: 24px; }
  #primary { flex: 1; min-width: 0; }
  #secondary { width: 402px; flex: none; }
  #player { aspect-ratio: 16 / 9; max-height: 240px; background: #000; border-radius: 12px; }
  h1 { font-size: 20px; margin: 12px 0; }
  #top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  #owner { display: flex; align-items: center; gap: 12px; }
  ytd-menu-renderer, #top-level-buttons-computed, #flexible-item-buttons { display: flex; align-items: center; }
  .pill { height: 36px; padding: 0 16px; margin-left: 8px; border: 0; border-radius: 18px; background: #f2f2f2; color: inherit;
    font: 500 14px Roboto, Arial, sans-serif; }
  html[dark] .pill { background: #272727; }
  #top-level-buttons-computed .pill:first-child { margin-left: 0; }
  ytd-text-inline-expander { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.05); }
  html[dark] ytd-text-inline-expander { background: rgba(255,255,255,.1); }
  ytd-text-inline-expander:not([is-expanded]) #expanded, ytd-text-inline-expander:not([is-expanded]) #collapse,
  ytd-text-inline-expander[is-expanded] #expand { display: none; }
  ytd-engagement-panel-section-list-renderer { height: 480px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 12px; display: flex; flex-direction: column; }
  ytd-engagement-panel-section-list-renderer[visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"] { display: none; }
  #header { display: flex; justify-content: space-between; padding: 8px 12px; }
  #content { flex: 1; overflow-y: auto; padding: 0 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #related div { height: 90px; margin-bottom: 8px; border-radius: 8px; background: rgba(0,0,0,.06); }
</style>
</head>
<body>
<script>
// Scenario comes from ?fx=: classic | modern | none | never | lazydesc | tabs | incremental | slowbatch | slow | open
//   | consolidated (the 2026 "In this video" panel: Timeline / Chapters / Transcript chips, lines rendered in chunks)
//   | lazyview (lines render only once the panel is on screen) | late (Show transcript ignores clicks for 1.5 s)
// &hl=th shows chip names in Thai; &lines=th makes the transcript itself Thai; &chip=transcript opens the consolidated panel on its Transcript chip;
// &dur=m:ss overrides the player's duration display; &reuse=1 makes Show transcript refill the existing line elements.
const policy = trustedTypes.createPolicy('fixture', { createHTML: (s) => s });
const params = new URLSearchParams(location.search);
const mode = params.get('fx') || 'classic';
const log = (window.fx = { showClicks: 0, closeClicks: 0, expandClicks: 0, collapseClicks: 0, chipClicks: 0,
  ignoredClicks: 0, renders: [], toasts: [] });
const loadedAt = Date.now();
let video = params.get('v');

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'on' ? el.addEventListener('click', v) : el.setAttribute(k, v);
  el.append(...kids);
  return el;
}

const lineText = (i) => params.get('lines') === 'th'
  ? `บรรทัดที่ ${i + 1} ของ ${video}:\n  สายเคเบิล  ห้อยเป็นเส้นโค้ง`   // a Thai-language transcript
  : `Line ${i + 1} of ${video}:\n  the cable  hangs in a curve.`;
const stamp = (i) => `${Math.floor(i / 6)}:${String((i * 10) % 60).padStart(2, '0')}`;
const batched = mode === 'incremental' || mode === 'slowbatch';
const consolidated = mode === 'consolidated';
const total = batched ? 200 : 40;
const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

function segment(i) {
  if (mode === 'modern' || consolidated) {
    const seg = h('transcript-segment-view-model', { class: 'ytwTranscriptSegmentViewModelHost' },
      h('div', { 'aria-hidden': 'true', class: 'ytwTranscriptSegmentViewModelTimestamp' }, stamp(i)),
      h('div', { class: 'ytwTranscriptSegmentViewModelTimestampA11yLabel sr-only' }, `${i * 10} seconds`),
      h('span', { role: 'text', class: 'ytAttributedStringHost ytAttributedStringWhiteSpacePreWrap' }, lineText(i)));
    if (!consolidated) return seg;
    // Wrapped as in the live "In this video" panel (dumped 2026-09-18).
    return h('div', {}, h('macro-markers-panel-item-view-model', { role: 'button', tabindex: '0' },
      h('timeline-item-view-model', {}, h('div', { class: 'ytwTimelineItemViewModelContentItems' }, seg))));
  }
  return h('ytd-transcript-segment-renderer', {},
    h('div', { class: 'segment' },
      h('div', { class: 'segment-start-offset' }, h('div', { class: 'segment-timestamp' }, stamp(i))),
      h('yt-formatted-string', { class: 'segment-text' }, lineText(i))));
}

// ---- page ----
const title = h('h1', {}, h('yt-formatted-string', {}, 'Why suspension bridges sag on purpose'));
const menu = h('ytd-menu-renderer', {});
function fillMenu() {
  menu.replaceChildren(
    h('div', { id: 'top-level-buttons-computed' }, h('button', { class: 'pill' }, 'Like · 4.1K'), h('button', { class: 'pill' }, 'Share')),
    h('div', { id: 'flexible-item-buttons' }, h('button', { class: 'pill' }, 'Save')),
    h('button', { class: 'pill', 'aria-label': 'More actions' }, '···'));
}
fillMenu();

const showButton = () => h('ytd-video-description-transcript-section-renderer', {},
  h('ytd-button-renderer', {}, h('button', { class: 'pill', 'aria-label': 'Show transcript', on: () => {
    if (mode === 'late' && Date.now() - loadedAt < 1500) return log.ignoredClicks++;  // handler not attached yet
    openPanel();
  } }, 'Show transcript')));
const expanded = h('div', { id: 'expanded' }, 'Full description. ');
const expander = h('ytd-text-inline-expander', { id: 'description-inline-expander' },
  h('div', {}, 'A primer on load paths. '),
  h('button', { id: 'expand', on: () => {
    log.expandClicks++; expander.setAttribute('is-expanded', '');
    if (mode === 'lazydesc') setTimeout(() => expanded.append(showButton()), 200);
  } }, '...more'),
  expanded,
  h('button', { id: 'collapse', on: () => {
    log.collapseClicks++; expander.removeAttribute('is-expanded');
    if (mode === 'lazydesc') expanded.querySelector('ytd-video-description-transcript-section-renderer')?.remove();
  } }, 'Show less'));
if (!['none', 'lazydesc'].includes(mode)) expanded.append(showButton());

const content = h('div', { id: 'content' });
const th = params.get('hl') === 'th';
const chipNames = consolidated ? (th ? ['ไทม์ไลน์', 'บท', 'ข้อความถอดเสียง'] : ['Timeline', 'Chapters', 'Transcript'])
  : (th ? ['บท', 'ข้อความถอดเสียง'] : ['Chapters', 'Transcript']);
const chips = chipNames.map((name, i) =>
  h('button', { role: 'tab', class: 'ytChipShapeButtonReset', 'aria-selected': 'false', on: () => { log.chipClicks++; selectChip(i); } }, name));
const tabs = h('div', { role: 'tablist' }, ...chips);
function selectChip(i, delay = 150) {
  chips.forEach((c, j) => c.setAttribute('aria-selected', String(i === j)));
  content.replaceChildren();
  if (i < chips.length - 1) return content.append(h('div', { class: 'chapter-row' }, h('div', {}, '0:00'), h('div', {}, 'Intro')));
  if (consolidated) renderChunks(delay); else setTimeout(() => render(0, total), delay);
}
const panel = h('ytd-engagement-panel-section-list-renderer', {
  'target-id': consolidated ? 'engagement-panel-timeline-view-consolidated'
    : mode === 'modern' ? 'PAmodern_transcript_view' : 'engagement-panel-searchable-transcript',
  visibility: 'ENGAGEMENT_PANEL_VISIBILITY_HIDDEN' },
  h('div', { id: 'header' }, h('span', {}, 'Transcript'),
    h('div', { id: 'visibility-button' }, h('button', { 'aria-label': 'Close transcript', on: () => {
      log.closeClicks++; panel.setAttribute('visibility', 'ENGAGEMENT_PANEL_VISIBILITY_HIDDEN');
    } }, '×'))),
  ...(mode === 'tabs' || consolidated ? [tabs] : []),
  content);
const related = h('div', { id: 'related' }, ...Array.from({ length: 6 }, () => h('div')));

document.body.append(h('ytd-app', {}, h('ytd-watch-flexy', {},
  h('div', { id: 'primary' }, h('div', { id: 'player' },
      h('div', { id: 'movie_player' }, h('span', { class: 'ytp-time-duration' }, params.get('dur') || clock(total * 10)))),
    h('ytd-watch-metadata', {},
      h('div', { id: 'title' }, title),
      h('div', { id: 'top-row' },
        h('div', { id: 'owner' }, h('b', {}, 'Field Notes on Structures'), h('button', { class: 'pill' }, 'Subscribe')),
        h('div', { id: 'actions' }, h('div', { id: 'actions-inner' }, h('div', { id: 'menu' }, menu)))),
      expander)),
  h('div', { id: 'secondary' }, h('div', { id: 'panels' }, mode === 'none' ? '' : panel), related))));

// ---- transcript behaviour ----
function render(from, to) {
  const segs = [];
  for (let i = from; i < to; i++) {
    if (i === 12 && mode === 'classic') segs.push(h('ytd-transcript-section-header-renderer', {}, h('div', {}, 'Chapter 2: Tension')));
    segs.push(segment(i));
  }
  content.append(...segs);
  const r = panel.getBoundingClientRect();
  const style = getComputedStyle(panel);
  log.lastRenderAt = Date.now();
  log.renders.push({ count: content.querySelectorAll('ytd-transcript-segment-renderer, transcript-segment-view-model').length,
    panelRight: r.right, panelWidth: r.width, relatedTop: related.getBoundingClientRect().top,
    panelOpacity: style.opacity, panelPosition: style.position, onScreen: r.right > 0 && r.left < innerWidth });
}

// The 2026 view renders a fetched transcript in chunks, a few frames apart.
function renderChunks(delay) {
  for (let from = 0; from < total; from += 10) setTimeout(() => render(from, from + 10), delay + from * 4);
}

// When the extension's note appears (to time a copy from the moment the last line rendered).
new MutationObserver((records) => {
  for (const r of records) if (r.target.classList.contains('ct-toast') && r.target.classList.contains('ct-on')) log.toasts.push(Date.now());
}).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });

if (batched) {
  content.addEventListener('scroll', () => {
    const have = content.querySelectorAll('ytd-transcript-segment-renderer').length;
    if (have < total && content.scrollTop + content.clientHeight >= content.scrollHeight - 2 && !content.dataset.loading) {
      content.dataset.loading = '1';
      setTimeout(() => { render(have, Math.min(have + 50, total)); delete content.dataset.loading; }, mode === 'slowbatch' ? 600 : 120);
    }
  });
}

function openPanel() {
  log.showClicks++;
  log.relatedTopBefore = related.getBoundingClientRect().top;
  panel.setAttribute('visibility', 'ENGAGEMENT_PANEL_VISIBILITY_EXPANDED');
  const texts = content.querySelectorAll('.segment-text, span[role="text"]');
  if (params.get('reuse') && texts.length) {    // a list that re-renders into the rows it already has
    return setTimeout(() => { texts.forEach((el, i) => { el.textContent = lineText(i); }); log.lastRenderAt = Date.now(); }, 300);
  }
  content.replaceChildren();
  if (mode === 'never') return;
  if (mode === 'tabs' || consolidated) return params.get('chip') === 'transcript' ? selectChip(chips.length - 1, 1000) : selectChip(0);
  if (mode === 'lazyview') {                    // like a list that renders its rows once it is in view
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) { io.disconnect(); setTimeout(() => render(0, total), 100); }
    });
    return io.observe(content);
  }
  setTimeout(() => render(0, batched ? 50 : total), mode === 'slow' ? 6500 : 300);
}

if (mode === 'open') openPanel();

// Simulates YouTube's in-app navigation to another video. With keepPanel, an open transcript panel stays
// open and still shows the previous video's lines until Show transcript is clicked again.
window.fxNavigate = (v, name, keepPanel = false) => {
  document.dispatchEvent(new CustomEvent('yt-navigate-start'));
  video = v;
  history.pushState({}, '', `/watch?v=${v}&fx=${mode}`);
  title.firstChild.textContent = name;
  fillMenu();                                   // YouTube redraws the action row
  if (!keepPanel) {
    panel.setAttribute('visibility', 'ENGAGEMENT_PANEL_VISIBILITY_HIDDEN');
    content.replaceChildren();
  }
  document.dispatchEvent(new CustomEvent('yt-navigate-finish'));
};
window.fxRedrawRow = fillMenu;
window.fxPolicy = policy;
</script>
</body>
</html>
